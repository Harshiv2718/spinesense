<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The phone sensor page contacts no other host: the recording stays on the phone until you send the file. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>SpineSense phone sensor</title>
  <meta name="description" content="Use your phone as a stand-in back sensor for SpineSense: it records how your upper back tilts, to check the webcam's measurements against.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232a78d6'/%3E%3Cg fill='white'%3E%3Crect x='9' y='3' width='6' height='3.4' rx='1.4'/%3E%3Crect x='8.4' y='7.6' width='7.2' height='3.4' rx='1.4'/%3E%3Crect x='8' y='12.2' width='8' height='3.6' rx='1.5'/%3E%3Crect x='8.4' y='17' width='7.2' height='3.6' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      const t = JSON.parse(localStorage.getItem('spinesense.v1') || '{}').settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* storage unavailable */ }
  </script>
</head>
<body class="phone-page">
  <main class="phone" id="phone" aria-live="polite"></main>
  <script type="module" src="js/phone.js"></script>
</body>
</html>
